name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Check the version matches the tag
        run: |
          $version = (python -c "import lolhex; print(lolhex.__version__)").Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match __version__ $version" }

      - name: Update the bundled statistics
        env:
          GITHUB_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          # Take the newest statistics; if that fails, keep the bundled data already committed.
          try { python scripts/update_data.py } catch { Write-Warning "Could not fetch new data; using the committed bundled data: $_" }
          if ($LASTEXITCODE) { Write-Warning "Could not fetch new data; using the committed bundled data"; $global:LASTEXITCODE = 0 }

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build
        run: pwsh -NoProfile -File packaging/build.ps1 -PythonExe python

      - name: Incremental update files (updates branch)
        run: |
          # Push before the Release so the manifest and files are already there
          # by the time a user sees the new version.
          $version = "${{ github.ref_name }}".TrimStart('v')
          python -m lolhex.patch build/dist/AramHex $version build/updates
          if ($LASTEXITCODE) { throw 'Failed to generate the incremental update files' }
          Push-Location build/updates
          git init -q -b updates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "AramHex $version incremental update files"
          # The branch serves older clients; the tag serves newer ones.
          # jsDelivr serves tags immediately but caches branches for hours.
          git tag "updates-v$version"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" updates:updates "updates-v$version"
          if ($LASTEXITCODE) { throw 'Failed to push the updates branch' }
          Pop-Location
          # jsDelivr caches branch files for up to 12 hours; purge after pushing.
          $m = Get-Content -Raw -Encoding UTF8 build/updates/manifest.json | ConvertFrom-Json
          $names = @('manifest.json') + ($m.patchable | ForEach-Object { "files/$_.gz"; "files/$_" })
          foreach ($n in $names) {
            try { Invoke-RestMethod -Uri "https://purge.jsdelivr.net/gh/${{ github.repository }}@updates/$n" -TimeoutSec 30 | Out-Null }
            catch { Write-Warning "Failed to purge jsDelivr for $n : $_" }
          }

      - name: Release notes
        run: python scripts/release_notes.py "${{ github.ref_name }}" > build/release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem build/release | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" @files --title "AramHex ${{ github.ref_name }}" --notes-file build/release-notes.md
